<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e111a"/>
      <stop offset="100%" stop-color="#05070a"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Subtle glow ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#glow)" stroke-width="8" opacity="0.4" filter="url(#blur)"/>
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#glow)" stroke-width="4" opacity="0.6"/>

  <!-- Soundwave & Cosmic Eye Motif -->
  <!-- Left wave bars (Echo) -->
  <rect x="144" y="216" width="16" height="80" rx="8" fill="#06b6d4"/>
  <rect x="180" y="176" width="16" height="160" rx="8" fill="#06b6d4"/>
  
  <!-- Center Core (Deja Pulse) -->
  <circle cx="256" cy="256" r="48" fill="url(#glow)"/>
  <circle cx="256" cy="256" r="24" fill="#ffffff"/>

  <!-- Right wave bars (Sync) -->
  <rect x="316" y="176" width="16" height="160" rx="8" fill="#ec4899"/>
  <rect x="352" y="216" width="16" height="80" rx="8" fill="#ec4899"/>
</svg>
